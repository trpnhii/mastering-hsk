# Build flashcards from CSV and deploy GitHub Pages.
# Trigger: pushes to road-to-hsk3 (not required to use main).
#
# One-time setup in the repo:
#   Settings → Pages → Build and deployment → Source: GitHub Actions

name: Deploy flashcards to GitHub Pages

on:
  push:
    branches:
      - road-to-hsk3
    paths:
      - "docs/**"
      - "Han1_Han2_tu_vung_gop.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build vocab.json
        run: python3 docs/build_vocab.py

      - name: Prepare site
        run: |
          mkdir -p _site
          cp docs/index.html docs/vocab.json docs/.nojekyll _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
